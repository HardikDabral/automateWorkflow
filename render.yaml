services:
  - type: web
    name: workflow-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run start --workspace=server
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: INLINE_WORKER
        value: "true"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_CALL_LIMIT
        value: "10"
      - key: TEST_RUN_LIMIT
        value: "3"
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
